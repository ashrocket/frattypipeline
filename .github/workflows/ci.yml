name: Game checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/import-song.sh
      - run: npx wrangler deploy --dry-run
