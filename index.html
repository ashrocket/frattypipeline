<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A0F" />
    <meta
      name="description"
      content="PIPELINE. A punk skateboard arena fighter. Twelve fictional houses, three lives, your chosen look. Burn the status quo."
    />
    <title>PIPELINE — Burn the status quo.</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" data-screen="title">
      <header class="topbar">
        <a class="brand" href="/" data-aria="home" aria-label="PIPELINE home"
          >PIPE<span>LINE</span><b>↗</b></a
        >
        <span class="header-flavor" data-copy="eyebrow"></span>
        <div class="top-actions">
          <span id="server-status" role="status">0 / 20 PLAYING</span
          ><button id="sound-btn" data-aria="sound" aria-label="PIPELINE sound">♫</button
          ><button id="pause-btn" data-aria="pause" aria-label="Pause PIPELINE" hidden>Ⅱ</button>
        </div>
      </header>
      <main id="stage" data-aria="game" aria-label="PIPELINE arcade game">
        <div id="world"></div>
        <section id="title-screen">
          <div class="hero-copy">
            <p class="eyebrow" data-copy="eyebrow"></p>
            <h1>PIPE<span>LINE</span><b>↗</b></h1>
            <p class="tagline" data-copy="tagline"></p>
            <p class="description" data-copy="description"></p>
            <button id="start-btn" class="primary" data-copy="start"></button>
            <button id="how-btn" class="secondary" data-copy="how"></button>
            <p class="keyboard-help" data-copy="controls"></p>
          </div>
          <section class="look-picker" data-aria="look" aria-label="PIPELINE starting look">
            <p class="eyebrow" data-copy="look"></p>
            <div id="look-options"></div>
            <div id="hair-options" data-aria="hair" aria-label="Hair color"></div>
            <p data-copy="lookHelp"></p>
            <p class="look-meaning" data-copy="prettyMeaning"></p>
          </section>
          <div class="title-ticker" data-copy="titleTicker"></div>
        </section>
        <p id="live-status" class="sr-only" aria-live="polite"></p>
        <div id="touch-controls" hidden>
          <div
            id="joystick"
            role="button"
            tabindex="0"
            data-aria="move"
            aria-label="Move; flick forward to push"
          >
            <span data-copy="move">MOVE</span><i id="stick"></i>
          </div>
          <button id="super-touch" data-copy="super" hidden>SUPER</button>
          <button id="ollie-touch" data-copy="ollie" data-aria="ollie" aria-label="Ollie">
            OLLIE ↑</button
          ><button
            id="fire-touch"
            data-copy="throw"
            data-aria="throw"
            aria-label="Hold to charge; release to throw"
          >
            THROW ↗
          </button>
        </div>
        <button id="mobile-pause" data-aria="pause" aria-label="Pause PIPELINE" hidden>Ⅱ</button>
        <section id="dialog" hidden class="dialog-backdrop">
          <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
            <p id="dialog-kicker" class="eyebrow">PIPELINE</p>
            <h2 id="dialog-title"></h2>
            <div id="dialog-body"></div>
            <div id="settings" hidden></div>
            <div class="dialog-actions">
              <button id="dialog-primary" class="primary"></button
              ><button id="dialog-secondary" class="secondary"></button>
            </div>
          </div>
        </section>
      </main>
      <footer>
        <span class="equalizer">▂ ▅ ▃ ▆</span><span id="track-label"></span
        ><span data-copy="titleTicker"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
